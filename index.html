<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>80 knee</title>

  <!-- 1. Paystack Official Payment SDK -->
  <script src="https://js.paystack.co/v1/inline.js"></script>

  <!-- 2. Firebase Cloud Database SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
    }
    body { 
      background: #0f172a; 
      color: white; 
      display: flex; 
      flex-direction: column; 
      height: 100vh; 
      overflow: hidden; 
    }
    
    /* Top Bar */
    .top-bar { 
      background: #1e293b; 
      padding: 12px 16px; 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      border-bottom: 1px solid #334155; 
      z-index: 10;
    }
    .logo { 
      font-size: 20px; 
      font-weight: 800; 
      color: #38bdf8; 
      letter-spacing: 0.5px; 
    }
    .user-pill { 
      background: #0f172a; 
      border: 1px solid #334155; 
      color: #38bdf8; 
      padding: 5px 12px; 
      border-radius: 20px; 
      font-size: 12px; 
      font-weight: 600; 
    }

    /* Screen Layouts */
    .screen { 
      flex: 1; 
      overflow-y: auto; 
      padding: 16px; 
      display: none; 
      flex-direction: column;
      padding-bottom: 85px !important; /* Space for bottom nav */
    }
    .screen.active { 
      display: flex; 
    }

    /* Auth Screen & Google Button */
    #auth-screen { 
      justify-content: center; 
      align-items: center; 
      text-align: center; 
    }
    .auth-card { 
      background: #1e293b; 
      padding: 24px; 
      border-radius: 18px; 
      width: 100%; 
      max-width: 350px; 
      border: 1px solid #334155; 
    }
    .google-btn { 
      width: 100%; 
      padding: 12px; 
      background: white; 
      color: #1f2937; 
      font-weight: 700; 
      font-size: 14px; 
      border: none; 
      border-radius: 10px; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      gap: 10px; 
      cursor: pointer; 
      margin-bottom: 14px;
    }
    .divider { 
      margin: 14px 0; 
      display: flex; 
      align-items: center; 
      color: #64748b; 
      font-size: 12px; 
    }
    .divider::before, .divider::after { 
      content: ""; 
      flex: 1; 
      height: 1px; 
      background: #334155; 
    }
    .divider span { 
      padding: 0 8px; 
    }

    /* Inputs & Buttons */
    .input-box { 
      width: 100%; 
      padding: 12px; 
      background: #0f172a; 
      border: 1px solid #334155; 
      border-radius: 10px; 
      color: white; 
      font-size: 14px; 
      margin-top: 6px; 
      margin-bottom: 12px; 
      outline: none; 
    }
    .btn { 
      width: 100%; 
      padding: 12px; 
      background: #10b981; 
      border: none; 
      border-radius: 10px; 
      color: white; 
      font-size: 15px; 
      font-weight: 700; 
      cursor: pointer; 
    }
    .btn-blue { 
      background: #0284c7; 
    }

    /* Feed Post Cards */
    .card { 
      background: #1e293b; 
      border-radius: 14px; 
      padding: 14px; 
      margin-bottom: 14px; 
      border: 1px solid #334155; 
    }
    .post-header { 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      margin-bottom: 8px; 
    }
    .post-actions { 
      display: flex; 
      gap: 16px; 
      padding-top: 10px; 
      border-top: 1px solid #334155; 
      font-size: 13px; 
      color: #94a3b8; 
    }
    .post-actions span { 
      cursor: pointer; 
      display: flex; 
      align-items: center; 
      gap: 4px; 
    }
    .edit-btn { 
      color: #38bdf8; 
      font-size: 12px; 
      cursor: pointer; 
      padding: 2px 6px; 
      border-radius: 4px; 
      background: rgba(56, 189, 248, 0.1); 
    }
    .comments-box { 
      margin-top: 10px; 
      padding-top: 10px; 
      border-top: 1px dashed #334155; 
      display: none; 
    }

    /* WhatsApp Style Chat */
    .contact-item { 
      display: flex; 
      align-items: center; 
      gap: 12px; 
      padding: 12px; 
      background: #1e293b; 
      border-radius: 12px; 
      margin-bottom: 8px; 
      cursor: pointer; 
      border: 1px solid #334155; 
    }
    .avatar { 
      width: 44px; 
      height: 44px; 
      border-radius: 50%; 
      background: #0284c7; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      font-weight: bold; 
      font-size: 16px; 
    }
    .chat-view { 
      position: fixed; 
      top: 0; 
      left: 0; 
      right: 0; 
      bottom: 0; 
      background: #0f172a; 
      z-index: 10000; 
      display: none; 
      flex-direction: column; 
    }
    .chat-header { 
      background: #1e293b; 
      padding: 12px 16px; 
      display: flex; 
      align-items: center; 
      gap: 12px; 
      border-bottom: 1px solid #334155; 
    }
    .chat-body { 
      flex: 1; 
      overflow-y: auto; 
      padding: 16px; 
      display: flex; 
      flex-direction: column; 
      gap: 8px; 
    }
    .bubble { 
      max-width: 80%; 
      padding: 10px 14px; 
      border-radius: 14px; 
      font-size: 14px; 
    }
    .bubble.me { 
      align-self: flex-end; 
      background: #0284c7; 
      border-bottom-right-radius: 2px; 
    }
    .bubble.them { 
      align-self: flex-start; 
      background: #1e293b; 
      border-bottom-left-radius: 2px; 
    }

    /* VTU & Telecom */
    .network-grid { 
      display: grid; 
      grid-template-columns: repeat(4, 1fr); 
      gap: 8px; 
      margin-bottom: 12px; 
    }
    .net-btn { 
      padding: 9px 2px; 
      background: #0f172a; 
      border: 1px solid #334155; 
      border-radius: 8px; 
      color: #94a3b8; 
      font-size: 11px; 
      font-weight: 700; 
      text-align: center; 
      cursor: pointer; 
    }
    .net-btn.selected { 
      border-color: #38bdf8; 
      color: #38bdf8; 
      background: rgba(56, 189, 248, 0.1); 
    }
    .vtu-toggle { 
      display: flex; 
      background: #0f172a; 
      border-radius: 8px; 
      padding: 3px; 
      margin-bottom: 14px; 
    }
    .vtu-toggle div { 
      flex: 1; 
      text-align: center; 
      padding: 8px; 
      font-size: 13px; 
      font-weight: 600; 
      cursor: pointer; 
      border-radius: 6px; 
      color: #94a3b8; 
    }
    .vtu-toggle div.active { 
      background: #0284c7; 
      color: white; 
    }

    /* Fixed Bottom Navigation Bar */
    .nav-bar { 
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 65px;
      background: #1e293b; 
      display: flex !important; 
      justify-content: space-around; 
      align-items: center;
      border-top: 1px solid #334155; 
      z-index: 9999;
      box-shadow: 0 -4px 10px rgba(0, 0, 0, 0.3);
    }
    .nav-item { 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      color: #94a3b8; 
      font-size: 11px; 
      cursor: pointer; 
    }
    .nav-item.active { 
      color: #38bdf8; 
      font-weight: 700; 
    }
    .nav-icon { 
      font-size: 19px; 
      margin-bottom: 2px; 
    }
  </style>
</head>
<body>


<!-- Top App Bar -->
  <div class="top-bar">
    <div class="logo">80 knee</div>
    <div class="user-pill" id="user-display">@Guest</div>
  </div>

  <!-- Screen 0: Auth Screen (Google Sign-In & Login Toggle) -->
  <div id="auth-screen" class="screen active">
    <div class="auth-card">
      <h2 style="color:#38bdf8; margin-bottom: 6px;" id="auth-title">Join 80 knee</h2>
      <p style="font-size:13px; color:#94a3b8; margin-bottom:16px;" id="auth-subtitle">Create an account to start posting and chatting</p>
      
      <!-- Google Auth Button -->
      <button class="google-btn" onclick="signInWithGoogle()">
        <svg width="18" height="18" viewBox="0 0 48 48">
          <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
          <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
          <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
          <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
        </svg>
        <span id="google-btn-text">Sign up with Google</span>
      </button>

      <div class="divider"><span>OR WITH USERNAME</span></div>

      <input type="text" id="auth-username" class="input-box" placeholder="Enter username (e.g. Etini)">
      <input type="password" id="auth-password" class="input-box" placeholder="Enter password">

      <button class="btn btn-blue" id="auth-submit-btn" onclick="handleManualAuth()">Sign Up</button>

      <!-- Toggle between Sign Up and Login -->
      <p style="font-size: 13px; color: #94a3b8; margin-top: 16px;">
        <span id="auth-toggle-label">Already have an account?</span> 
        <a href="javascript:void(0)" onclick="toggleAuthMode()" id="auth-toggle-btn" style="color: #38bdf8; font-weight: bold; text-decoration: none;">Log In</a>
      </p>
    </div>
  </div>

  <!-- Screen 1: Feed (Post, Edit, Like, Comment, Share) -->
  <div id="feed-screen" class="screen">
    <!-- Post Creator -->
    <div class="card">
      <textarea id="post-input" class="input-box" rows="2" style="resize:none;" placeholder="What's on your mind? Share a post..."></textarea>
      <button class="btn btn-blue" onclick="createPost()">Share Post</button>
    </div>

    <!-- Live Cloud Posts Container -->
    <div id="posts-container"></div>
  </div>

  <!-- Screen 2: WhatsApp Style Chat Contacts -->
  <div id="chat-screen" class="screen">
    <h3 style="font-size: 16px; margin-bottom: 12px; color: #94a3b8;">Contacts</h3>
    <div id="contacts-list"></div>
  </div>

  <!-- 1-on-1 Fullscreen Chat Room (WhatsApp Style) -->
  <div id="chat-view" class="chat-view">
    <div class="chat-header">
      <span onclick="closeChat()" style="font-size: 22px; cursor: pointer; padding-right: 8px;">←</span>
      <div class="avatar" id="active-chat-avatar" style="width:36px; height:36px; font-size:14px;">?</div>
      <div>
        <div style="font-weight: bold; font-size: 15px;" id="active-chat-name">Contact</div>
        <div style="font-size: 11px; color: #10b981;">Online (Cloud Synced)</div>
      </div>
    </div>
    <div class="chat-body" id="chat-body"></div>
    <div style="padding: 10px; background: #1e293b; display: flex; gap: 8px;">
      <input type="text" id="chat-input" class="input-box" style="margin:0;" placeholder="Type a message...">
      <button class="btn btn-blue" style="width:auto; padding: 0 16px;" onclick="sendChatMessage()">Send</button>
    </div>
  </div>

  <!-- Screen 3: VTU (Direct Bank Payment) -->
  <div id="vtu-screen" class="screen">
    <div class="vtu-toggle">
      <div id="toggle-airtime" class="active" onclick="setVtuMode('airtime')">Airtime</div>
      <div id="toggle-data" onclick="setVtuMode('data')">Data Bundle</div>
    </div>

    <div class="network-grid">
      <div class="net-btn selected" onclick="pickNet(this)">MTN</div>
      <div class="net-btn" onclick="pickNet(this)">AIRTEL</div>
      <div class="net-btn" onclick="pickNet(this)">GLO</div>
      <div class="net-btn" onclick="pickNet(this)">9MOBILE</div>
    </div>

    <label style="font-size: 13px; color: #94a3b8;">Recipient Phone Number</label>
    <input type="tel" id="vtu-phone" class="input-box" placeholder="e.g. 08012345678">

    <!-- Airtime -->
    <div id="airtime-section">
      <label style="font-size: 13px; color: #94a3b8;">Amount (₦)</label>
      <input type="number" id="airtime-amount" class="input-box" placeholder="e.g. 500">
    </div>

    <!-- Data Bundles -->
    <div id="data-section" style="display:none;">
      <label style="font-size: 13px; color: #94a3b8;">Select Data Bundle</label>
      <select id="data-plan-select" class="input-box" style="background:#0f172a;">
        <option value="350">1.0 GB Daily - ₦350</option>
        <option value="600">2.5 GB (2 Days) - ₦600</option>
        <option value="1500">5.0 GB Monthly - ₦1,500</option>
        <option value="3000">10.0 GB Monthly - ₦3,000</option>
        <option value="5500">20.0 GB Monthly - ₦5,500</option>
      </select>
    </div>

    <button class="btn" onclick="openBankCheckout()">Pay From Bank Account</button>
  </div>

  <!-- Fixed Bottom Navigation Bar -->
  <div class="nav-bar" id="main-nav">
    <div class="nav-item active" onclick="switchTab('feed-screen', this)">
      <div class="nav-icon">📰</div>
      <span>Feed</span>
    </div>
    <div class="nav-item" onclick="switchTab('chat-screen', this)">
      <div class="nav-icon">💬</div>
      <span>Chat</span>
    </div>
    <div class="nav-item" onclick="switchTab('vtu-screen', this)">
      <div class="nav-icon">⚡</div>
      <span>Airtime/Data</span>
    </div>
  </div>

<script>
    // ==========================================
    // 1. YOUR REAL FIREBASE CLOUD DATABASE
    // ==========================================
    const firebaseConfig = {
      apiKey: "AIzaSyDe36CpQIndbGJ7Wq9ViBQJZXRYJY4lD9U",
      authDomain: "eighty-knee.firebaseapp.com",
      projectId: "eighty-knee",
      storageBucket: "eighty-knee.firebasestorage.app",
      messagingSenderId: "815262892973",
      appId: "1:815262892973:web:d8e3e5f897ed50ffff1724"
    };

    // Initialize Firebase & Cloud Firestore
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let currentUser = null;
    let isLoginMode = false;
    let vtuMode = 'airtime';
    let selectedNet = 'MTN';
    let activeChatContact = null;
    let chatUnsubscribe = null;

    // ==========================================
    // 2. AUTHENTICATION & APP ENTRY
    // ==========================================
    function toggleAuthMode() {
      isLoginMode = !isLoginMode;
      document.getElementById('auth-title').innerText = isLoginMode ? 'Welcome Back' : 'Join 80 knee';
      document.getElementById('auth-subtitle').innerText = isLoginMode ? 'Log in to your account' : 'Create an account to start posting and chatting';
      document.getElementById('google-btn-text').innerText = isLoginMode ? 'Log in with Google' : 'Sign up with Google';
      document.getElementById('auth-submit-btn').innerText = isLoginMode ? 'Log In' : 'Sign Up';
      document.getElementById('auth-toggle-label').innerText = isLoginMode ? "Don't have an account?" : "Already have an account?";
      document.getElementById('auth-toggle-btn').innerText = isLoginMode ? 'Sign Up' : 'Log In';
    }

    function signInWithGoogle() {
      let defaultName = 'Etini Obop';
      let user = prompt('Enter or confirm your display name:', defaultName);
      if (!user) user = defaultName;
      enterApp(user.trim());
    }

    function handleManualAuth() {
      const user = document.getElementById('auth-username').value.trim();
      const pass = document.getElementById('auth-password').value.trim();
      if (!user || !pass) {
        alert('Please enter both username and password!');
        return;
      }
      enterApp(user);
    }

    function enterApp(username) {
      currentUser = username;
      document.getElementById('user-display').innerText = '@' + currentUser;
      document.getElementById('auth-screen').classList.remove('active');
      document.getElementById('feed-screen').classList.add('active');
      
      // Start real-time cloud listeners
      listenToLiveFeed();
      renderContacts();
    }

    function switchTab(screenId, element) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
      document.getElementById(screenId).classList.add('active');
      element.classList.add('active');
    }

    // ==========================================
    // 3. REAL-TIME MULTI-USER SOCIAL FEED
    // ==========================================
    function listenToLiveFeed() {
      db.collection('posts')
        .orderBy('timestamp', 'desc')
        .onSnapshot(snapshot => {
          const container = document.getElementById('posts-container');
          container.innerHTML = '';

          if (snapshot.empty) {
            container.innerHTML = '<p style="color:#64748b; text-align:center; padding:20px;">No posts yet. Be the first to share something on 80 knee!</p>';
            return;
          }

          snapshot.forEach(doc => {
            const post = { id: doc.id, ...doc.data() };
            const isMine = post.author === currentUser;
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
              <div class="post-header">
                <h4 style="color:#38bdf8;">@${post.author}</h4>
                ${isMine ? `<span class="edit-btn" onclick="editPost('${post.id}', '${encodeURIComponent(post.content)}')">✏️ Edit</span>` : ''}
              </div>
              <p style="font-size: 14px; color: #cbd5e1; line-height: 1.4; margin-bottom: 10px;">${post.content}</p>
              
              <div class="post-actions">
                <span onclick="toggleLike('${post.id}', ${post.likes || 0})">
                  ${(post.likedBy || []).includes(currentUser) ? '❤️' : '🤍'} ${post.likes || 0}
                </span>
                <span onclick="toggleComments('${post.id}')">
                  💬 ${(post.comments || []).length} Comments
                </span>
                <span onclick="sharePost('${encodeURIComponent(post.content)}', '${post.author}')">
                  🔗 Share
                </span>
              </div>

              <!-- Collapsible Comments -->
              <div class="comments-box" id="comments-${post.id}">
                <div style="font-size: 13px; color: #94a3b8; display:flex; flex-direction:column; gap:4px; margin-bottom:8px;">
                  ${(post.comments || []).map(c => `<div>• <b>${c.user}:</b> ${c.text}</div>`).join('')}
                </div>
                <div style="display:flex; gap:6px;">
                  <input type="text" id="comment-input-${post.id}" class="input-box" style="margin:0; padding:8px 10px; font-size:12px;" placeholder="Write a comment...">
                  <button class="btn btn-blue" style="width:auto; padding:0 12px; font-size:12px;" onclick="addComment('${post.id}')">Reply</button>
                </div>
              </div>
            `;
            container.appendChild(card);
          });
        }, error => {
          console.error("Firestore Feed Error:", error);
        });
    }

    async function createPost() {
      const input = document.getElementById('post-input');
      const text = input.value.trim();
      if (!text) return;

      try {
        await db.collection('posts').add({
          author: currentUser,
          content: text,
          likes: 0,
          likedBy: [],
          comments: [],
          timestamp: firebase.firestore.FieldValue.serverTimestamp()
        });
        input.value = '';
      } catch (err) {
        alert('Could not save post to cloud: ' + err.message);
      }
    }

    async function editPost(id, oldTextEncoded) {
      const oldText = decodeURIComponent(oldTextEncoded);
      const newText = prompt('Edit your post:', oldText);
      if (newText !== null && newText.trim() !== '') {
        await db.collection('posts').doc(id).update({
          content: newText.trim()
        });
      }
    }

    async function toggleLike(id, currentLikes) {
      const ref = db.collection('posts').doc(id);
      const doc = await ref.get();
      if (!doc.exists) return;
      
      const likedBy = doc.data().likedBy || [];
      const isLiked = likedBy.includes(currentUser);

      if (isLiked) {
        await ref.update({
          likes: Math.max(0, currentLikes - 1),
          likedBy: firebase.firestore.FieldValue.arrayRemove(currentUser)
        });
      } else {
        await ref.update({
          likes: currentLikes + 1,
          likedBy: firebase.firestore.FieldValue.arrayUnion(currentUser)
        });
      }
    }

    function toggleComments(id) {
      const box = document.getElementById(`comments-${id}`);
      box.style.display = box.style.display === 'block' ? 'none' : 'block';
    }

    async function addComment(id) {
      const input = document.getElementById(`comment-input-${id}`);
      const val = input.value.trim();
      if (!val) return;

      await db.collection('posts').doc(id).update({
        comments: firebase.firestore.FieldValue.arrayUnion({
          user: currentUser,
          text: val
        })
      });
      input.value = '';
    }

    function sharePost(contentEncoded, author) {
      const text = `"${decodeURIComponent(contentEncoded)}" — @${author} on 80 knee`;
      if (navigator.share) {
        navigator.share({ title: '80 knee', text: text, url: window.location.href });
      } else {
        navigator.clipboard.writeText(text);
        alert('Post copied to clipboard!');
      }
    }

    // ==========================================
    // 4. REAL-TIME CLOUD MESSAGING (WhatsApp Style)
    // ==========================================
    let contacts = [
      { id: 'support', name: '80 knee Support', avatar: 'S' },
      { id: 'chinedu', name: 'Chinedu Eze', avatar: 'C' },
      { id: 'amina', name: 'Amina Bello', avatar: 'A' }
    ];

    function renderContacts() {
      const list = document.getElementById('contacts-list');
      list.innerHTML = '';
      contacts.forEach(c => {
        const item = document.createElement('div');
        item.className = 'contact-item';
        item.onclick = () => openChat(c);
        item.innerHTML = `
          <div class="avatar">${c.avatar}</div>
          <div style="flex:1;">
            <div style="font-weight:bold; font-size:15px;">${c.name}</div>
            <div style="font-size:12px; color:#10b981;">Tap to chat in real-time</div>
          </div>
        `;
        list.appendChild(item);
      });
    }

    function openChat(contact) {
      activeChatContact = contact;
      document.getElementById('active-chat-name').innerText = contact.name;
      document.getElementById('active-chat-avatar').innerText = contact.avatar;
      document.getElementById('chat-view').style.display = 'flex';

      if (chatUnsubscribe) chatUnsubscribe();

      // Creates a shared chat room ID between the two users
      const chatId = [currentUser, contact.name].sort().join('_');
      chatUnsubscribe = db.collection('chats').doc(chatId).collection('messages')
        .orderBy('timestamp', 'asc')
        .onSnapshot(snapshot => {
          const body = document.getElementById('chat-body');
          body.innerHTML = '';
          snapshot.forEach(doc => {
            const m = doc.data();
            const bubble = document.createElement('div');
            bubble.className = `bubble ${m.sender === currentUser ? 'me' : 'them'}`;
            bubble.innerText = m.text;
            body.appendChild(bubble);
          });
          body.scrollTop = body.scrollHeight;
        });
    }

    function closeChat() {
      document.getElementById('chat-view').style.display = 'none';
      if (chatUnsubscribe) {
        chatUnsubscribe();
        chatUnsubscribe = null;
      }
    }

    async function sendChatMessage() {
      const input = document.getElementById('chat-input');
      const text = input.value.trim();
      if (!text || !activeChatContact) return;

      const chatId = [currentUser, activeChatContact.name].sort().join('_');
      input.value = '';

      await db.collection('chats').doc(chatId).collection('messages').add({
        sender: currentUser,
        receiver: activeChatContact.name,
        text: text,
        timestamp: firebase.firestore.FieldValue.serverTimestamp()
      });
    }

    // ==========================================
    // 5. VTU & PAYSTACK DIRECT BANK CHECKOUT
    // ==========================================
    function setVtuMode(mode) {
      vtuMode = mode;
      document.getElementById('toggle-airtime').className = mode === 'airtime' ? 'active' : '';
      document.getElementById('toggle-data').className = mode === 'data' ? 'active' : '';
      document.getElementById('airtime-section').style.display = mode === 'airtime' ? 'block' : 'none';
      document.getElementById('data-section').style.display = mode === 'data' ? 'block' : 'none';
    }

    function pickNet(btn) {
      document.querySelectorAll('.net-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      selectedNet = btn.innerText;
    }

    function openBankCheckout() {
      const phone = document.getElementById('vtu-phone').value.trim();
      if (!phone || phone.length < 10) {
        alert('Please enter a valid recipient phone number!');
        return;
      }

      let amount = 0;
      let label = '';

      if (vtuMode === 'airtime') {
        amount = parseFloat(document.getElementById('airtime-amount').value);
        if (!amount || amount < 50) {
          alert('Minimum airtime amount is ₦50');
          return;
        }
        label = `₦${amount} ${selectedNet} Airtime`;
      } else {
        const select = document.getElementById('data-plan-select');
        amount = parseFloat(select.value);
        label = `${selectedNet} ${select.options[select.selectedIndex].text}`;
      }

      payWithPaystack(amount, label, phone);
    }

    function payWithPaystack(amount, label, phone) {
      // Your Paystack test public key
      const PAYSTACK_PUBLIC_KEY = 'pk_test_cb2462e92ec4eb68705be2ffc5cf7b322a45a329';

      const userEmail = currentUser && currentUser.includes('@') 
        ? currentUser 
        : `${(currentUser || 'user').toLowerCase().replace(/\s+/g, '')}@80knee.com`;

      const handler = PaystackPop.setup({
        key: PAYSTACK_PUBLIC_KEY,
        email: userEmail,
        amount: amount * 100, // Converts Naira to Kobo
        currency: 'NGN',
        ref: '80KNEE_' + Math.floor((Math.random() * 1000000000) + 1),
        channels: ['bank_transfer', 'card', 'ussd', 'bank'],
        callback: function(response) {
          alert(`🎉 Payment Successful!\n\nReference: ${response.reference}\n\nYour ${label} for ${phone} is now being processed.`);
        },
        onClose: function() {
          alert('Payment window closed. Transaction was cancelled.');
        }
      });

      handler.openIframe();
    }
  </script>
</body>
