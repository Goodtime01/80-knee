<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>80 knee</title>

  <!-- 1. Paystack Official SDK -->
  <script src="https://js.paystack.co/v1/inline.js"></script>

  <!-- 2. Firebase App, Firestore & REAL AUTH SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
    }
    body { 
      background: #0f172a; 
      color: white; 
      display: flex; 
      flex-direction: column; 
      height: 100vh; 
      overflow: hidden; 
    }
    
    /* Top Header */
    .top-bar { 
      background: #1e293b; 
      padding: 12px 16px; 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      border-bottom: 1px solid #334155; 
      z-index: 10;
    }
    .logo { 
      font-size: 20px; 
      font-weight: 800; 
      color: #38bdf8; 
      letter-spacing: 0.5px; 
    }
    .user-pill { 
      background: #0f172a; 
      border: 1px solid #334155; 
      color: #38bdf8; 
      padding: 5px 12px; 
      border-radius: 20px; 
      font-size: 12px; 
      font-weight: 600; 
    }

    /* Screen Layouts */
    .screen { 
      flex: 1; 
      overflow-y: auto; 
      padding: 16px; 
      display: none; 
      flex-direction: column;
      padding-bottom: 85px !important; 
    }
    .screen.active { 
      display: flex; 
    }

    /* Auth Screen */
    #auth-screen { 
      justify-content: center; 
      align-items: center; 
      text-align: center; 
    }
    .auth-card { 
      background: #1e293b; 
      padding: 24px; 
      border-radius: 18px; 
      width: 100%; 
      max-width: 350px; 
      border: 1px solid #334155; 
    }
    .google-btn { 
      width: 100%; 
      padding: 12px; 
      background: white; 
      color: #1f2937; 
      font-weight: 700; 
      font-size: 14px; 
      border: none; 
      border-radius: 10px; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      gap: 10px; 
      cursor: pointer; 
      margin-bottom: 14px;
    }
    .divider { 
      margin: 14px 0; 
      display: flex; 
      align-items: center; 
      color: #64748b; 
      font-size: 12px; 
    }
    .divider::before, .divider::after { 
      content: ""; 
      flex: 1; 
      height: 1px; 
      background: #334155; 
    }
    .divider span { 
      padding: 0 8px; 
    }

    /* Inputs & Buttons */
    .input-box { 
      width: 100%; 
      padding: 12px; 
      background: #0f172a; 
      border: 1px solid #334155; 
      border-radius: 10px; 
      color: white; 
      font-size: 14px; 
      margin-top: 6px; 
      margin-bottom: 12px; 
      outline: none; 
    }
    .btn { 
      width: 100%; 
      padding: 12px; 
      background: #10b981; 
      border: none; 
      border-radius: 10px; 
      color: white; 
      font-size: 15px; 
      font-weight: 700; 
      cursor: pointer; 
    }
    .btn-blue { 
      background: #0284c7; 
    }
/* Post Cards */
    .card { 
      background: #1e293b; 
      border-radius: 14px; 
      padding: 14px; 
      margin-bottom: 14px; 
      border: 1px solid #334155; 
    }
    .post-header { 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      margin-bottom: 8px; 
    }
    .post-actions { 
      display: flex; 
      gap: 16px; 
      padding-top: 10px; 
      border-top: 1px solid #334155; 
      font-size: 13px; 
      color: #94a3b8; 
    }
    .post-actions span { 
      cursor: pointer; 
      display: flex; 
      align-items: center; 
      gap: 4px; 
    }
    .edit-btn { 
      color: #38bdf8; 
      font-size: 12px; 
      cursor: pointer; 
      padding: 2px 6px; 
      border-radius: 4px; 
      background: rgba(56, 189, 248, 0.1); 
    }
    .comments-box { 
      margin-top: 10px; 
      padding-top: 10px; 
      border-top: 1px dashed #334155; 
      display: none; 
    }

    /* Contacts & Chat */
    .contact-item { 
      display: flex; 
      align-items: center; 
      justify-content: space-between;
      gap: 12px; 
      padding: 12px; 
      background: #1e293b; 
      border-radius: 12px; 
      margin-bottom: 8px; 
      border: 1px solid #334155; 
    }
    .avatar { 
      width: 44px; 
      height: 44px; 
      border-radius: 50%; 
      background: #0284c7; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      font-weight: bold; 
      font-size: 16px; 
    }
    .chat-view { 
      position: fixed; 
      top: 0; 
      left: 0; 
      right: 0; 
      bottom: 0; 
      background: #0f172a; 
      z-index: 10000; 
      display: none; 
      flex-direction: column; 
    }
    .chat-header { 
      background: #1e293b; 
      padding: 12px 16px; 
      display: flex; 
      align-items: center; 
      gap: 12px; 
      border-bottom: 1px solid #334155; 
    }
    .chat-body { 
      flex: 1; 
      overflow-y: auto; 
      padding: 16px; 
      display: flex; 
      flex-direction: column; 
      gap: 8px; 
    }
    .bubble { 
      max-width: 80%; 
      padding: 10px 14px; 
      border-radius: 14px; 
      font-size: 14px; 
    }
    .bubble.me { 
      align-self: flex-end; 
      background: #0284c7; 
      border-bottom-right-radius: 2px; 
    }
    .bubble.them { 
      align-self: flex-start; 
      background: #1e293b; 
      border-bottom-left-radius: 2px; 
    }

    /* VTU & Telecom */
    .network-grid { 
      display: grid; 
      grid-template-columns: repeat(4, 1fr); 
      gap: 8px; 
      margin-bottom: 12px; 
    }
    .net-btn { 
      padding: 9px 2px; 
      background: #0f172a; 
      border: 1px solid #334155; 
      border-radius: 8px; 
      color: #94a3b8; 
      font-size: 11px; 
      font-weight: 700; 
      text-align: center; 
      cursor: pointer; 
    }
    .net-btn.selected { 
      border-color: #38bdf8; 
      color: #38bdf8; 
      background: rgba(56, 189, 248, 0.1); 
    }
    .vtu-toggle { 
      display: flex; 
      background: #0f172a; 
      border-radius: 8px; 
      padding: 3px; 
      margin-bottom: 14px; 
    }
    .vtu-toggle div { 
      flex: 1; 
      text-align: center; 
      padding: 8px; 
      font-size: 13px; 
      font-weight: 600; 
      cursor: pointer; 
      border-radius: 6px; 
      color: #94a3b8; 
    }
    .vtu-toggle div.active { 
      background: #0284c7; 
      color: white; 
    }

    /* Fixed Bottom Nav */
    .nav-bar { 
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 65px;
      background: #1e293b; 
      display: flex; 
      justify-content: space-around; 
      align-items: center;
      border-top: 1px solid #334155; 
      z-index: 9999;
      box-shadow: 0 -4px 10px rgba(0, 0, 0, 0.3);
    }
    .nav-item { 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      color: #94a3b8; 
      font-size: 11px; 
      cursor: pointer; 
    }
    .nav-item.active { 
      color: #38bdf8; 
      font-weight: 700; 
    }
    .nav-icon { 
      font-size: 19px; 
      margin-bottom: 2px; 
    }
  </style>
</head>
<body>

  <!-- Top Header -->
  <div class="top-bar">
    <div class="logo">80 knee</div>
    <div class="user-pill" id="user-display">🔒 Sign In Required</div>
  </div>

  <!-- Screen 0: Strict Authentication Lockout -->
  <div id="auth-screen" class="screen active">
    <div class="auth-card">
      <h2 style="color:#38bdf8; margin-bottom: 6px;" id="auth-title">Welcome to 80 knee</h2>
      <p style="font-size:13px; color:#94a3b8; margin-bottom:16px;" id="auth-subtitle">Sign in or create an account to access 80 knee</p>
      
      <!-- REAL Google Sign-In Button -->
      <button class="google-btn" type="button" onclick="signInWithGoogle()">
        <svg width="18" height="18" viewBox="0 0 48 48">
          <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
          <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
          <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
          <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
        </svg>
        <span id="google-btn-text">Continue with Google</span>
      </button>

      <div class="divider"><span>OR WITH EMAIL & PASSWORD</span></div>

      <input type="email" id="auth-email" class="input-box" placeholder="Email Address (e.g. name@gmail.com)">
      <div id="phone-field-wrapper">
        <input type="tel" id="auth-phone" class="input-box" placeholder="Phone Number with country code (+234...)">
      </div>
      <input type="password" id="auth-password" class="input-box" placeholder="Password">

      <button class="btn btn-blue" id="auth-submit-btn" type="button" onclick="handleAuth()">Sign Up & Continue</button>

      <!-- Toggle Sign Up vs Login -->
      <p style="font-size: 13px; color: #94a3b8; margin-top: 16px;">
        <span id="auth-toggle-label">Already have an account?</span> 
        <a href="javascript:void(0)" onclick="toggleAuthMode()" id="auth-toggle-btn" style="color: #38bdf8; font-weight: bold; text-decoration: none;">Log In</a>
      </p>
    </div>
  </div>

<!-- Screen 1: Feed -->
  <div id="feed-screen" class="screen">
    <div class="card">
      <textarea id="post-input" class="input-box" rows="2" style="resize:none;" placeholder="Share a post with your contacts..."></textarea>
      <button class="btn btn-blue" type="button" onclick="createPost()">Share Post</button>
    </div>
    <div id="posts-container"></div>
  </div>

  <!-- Screen 2: Contacts & Chats -->
  <div id="chat-screen" class="screen">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
      <h3 style="font-size: 15px; color: #94a3b8;">Phone Contacts</h3>
      <button class="btn btn-blue" style="width:auto; padding:6px 14px; font-size:12px;" type="button" onclick="syncPhoneContacts()">
        📲 Sync Contacts
      </button>
    </div>
    <div id="contacts-list"></div>
  </div>

  <!-- WhatsApp Style Chat Room -->
  <div id="chat-view" class="chat-view">
    <div class="chat-header">
      <span onclick="closeChat()" style="font-size: 22px; cursor: pointer; padding-right: 8px;">←</span>
      <div class="avatar" id="active-chat-avatar" style="width:36px; height:36px; font-size:14px;">?</div>
      <div>
        <div style="font-weight: bold; font-size: 15px;" id="active-chat-name">Contact</div>
        <div style="font-size: 11px; color: #10b981;">Online (1-on-1 Direct Message)</div>
      </div>
    </div>
    <div class="chat-body" id="chat-body"></div>
    <div style="padding: 10px; background: #1e293b; display: flex; gap: 8px;">
      <input type="text" id="chat-input" class="input-box" style="margin:0;" placeholder="Message...">
      <button class="btn btn-blue" style="width:auto; padding: 0 16px;" type="button" onclick="sendChatMessage()">Send</button>
    </div>
  </div>

  <!-- Screen 3: VTU Services -->
  <div id="vtu-screen" class="screen">
    <div class="vtu-toggle">
      <div id="toggle-airtime" class="active" onclick="setVtuMode('airtime')">Airtime</div>
      <div id="toggle-data" onclick="setVtuMode('data')">Data Bundle</div>
    </div>

    <div class="network-grid">
      <div class="net-btn selected" onclick="pickNet(this)">MTN</div>
      <div class="net-btn" onclick="pickNet(this)">AIRTEL</div>
      <div class="net-btn" onclick="pickNet(this)">GLO</div>
      <div class="net-btn" onclick="pickNet(this)">9MOBILE</div>
    </div>

    <label style="font-size: 13px; color: #94a3b8;">Recipient Phone Number</label>
    <input type="tel" id="vtu-phone" class="input-box" placeholder="e.g. 08012345678">

    <div id="airtime-section">
      <label style="font-size: 13px; color: #94a3b8;">Amount (₦)</label>
      <input type="number" id="airtime-amount" class="input-box" placeholder="e.g. 500">
    </div>

    <div id="data-section" style="display:none;">
      <label style="font-size: 13px; color: #94a3b8;">Select Data Bundle</label>
      <select id="data-plan-select" class="input-box" style="background:#0f172a;">
        <option value="350">1.0 GB Daily - ₦350</option>
        <option value="600">2.5 GB (2 Days) - ₦600</option>
        <option value="1500">5.0 GB Monthly - ₦1,500</option>
        <option value="3000">10.0 GB Monthly - ₦3,000</option>
        <option value="5500">20.0 GB Monthly - ₦5,500</option>
      </select>
    </div>

    <button class="btn" type="button" onclick="openBankCheckout()">Pay From Bank Account</button>
  </div>

  <!-- Bottom Navigation Bar (Locked until login) -->
  <div class="nav-bar" id="main-nav" style="display:none !important;">
    <div class="nav-item active" onclick="switchTab('feed-screen', this)">
      <div class="nav-icon">📰</div>
      <span>Feed</span>
    </div>
    <div class="nav-item" onclick="switchTab('chat-screen', this)">
      <div class="nav-icon">💬</div>
      <span>Chat</span>
    </div>
    <div class="nav-item" onclick="switchTab('vtu-screen', this)">
      <div class="nav-icon">⚡</div>
      <span>Airtime/Data</span>
    </div>
  </div>


<script>
    // ==========================================
    // 1. FIREBASE INITIALIZATION & REAL AUTH
    // ==========================================
    const firebaseConfig = {
      apiKey: "AIzaSyDe36CpQIndbGJ7Wq9ViBQJZXRYJY4lD9U",
      authDomain: "eighty-knee.firebaseapp.com",
      projectId: "eighty-knee",
      storageBucket: "eighty-knee.firebasestorage.app",
      messagingSenderId: "815262892973",
      appId: "1:815262892973:web:d8e3e5f897ed50ffff1724"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();
    const googleProvider = new firebase.auth.GoogleAuthProvider();

    let currentUser = null;
    let currentUserPhone = null;
    let isLoginMode = false;
    let vtuMode = 'airtime';
    let selectedNet = 'MTN';
    let activeChatContact = null;
    let chatUnsubscribe = null;
    let mySyncedContacts = [];

    function cleanPhone(num) {
      if (!num) return '';
      let cleaned = num.trim().replace(/[\s\-\(\)]/g, '');
      if (cleaned.startsWith('0') && cleaned.length === 11) {
        cleaned = '+234' + cleaned.substring(1);
      }
      return cleaned;
    }

    // Toggle Sign Up vs Log In mode
    function toggleAuthMode() {
      isLoginMode = !isLoginMode;
      document.getElementById('auth-title').innerText = isLoginMode ? 'Welcome Back' : 'Welcome to 80 knee';
      document.getElementById('auth-subtitle').innerText = isLoginMode ? 'Log in with your email and password' : 'Create an account to access 80 knee';
      document.getElementById('auth-submit-btn').innerText = isLoginMode ? 'Log In' : 'Sign Up & Continue';
      document.getElementById('auth-toggle-label').innerText = isLoginMode ? "Don't have an account?" : "Already have an account?";
      document.getElementById('auth-toggle-btn').innerText = isLoginMode ? 'Sign Up' : 'Log In';
      document.getElementById('phone-field-wrapper').style.display = isLoginMode ? 'none' : 'block';
    }

    // ==========================================
    // REAL GOOGLE AUTH (OFFICIAL GOOGLE POPUP)
    // ==========================================
    async function signInWithGoogle() {
      try {
        const result = await auth.signInWithPopup(googleProvider);
        const user = result.user;

        // Check if user already has phone number saved in database
        const userDoc = await db.collection('users').doc(user.uid).get();
        let phone = userDoc.exists ? userDoc.data().phone : null;

        if (!phone) {
          phone = prompt(`Google Verified (${user.email})!\nEnter your phone number with country code (+234...) to sync contacts:`);
          phone = cleanPhone(phone);
          if (!phone || phone.length < 8) {
            alert('A valid phone number is required to use 80 knee.');
            auth.signOut();
            return;
          }

          await db.collection('users').doc(user.uid).set({
            email: user.email,
            phone: phone,
            name: user.displayName || user.email.split('@')[0],
            authType: 'google',
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
          });
        }

        completeLogin(user.displayName || user.email, phone);
      } catch (error) {
        console.error('Google Sign-In Error:', error);
        alert('Google Authentication: ' + error.message);
      }
    }

    // ==========================================
    // REAL EMAIL & PASSWORD (FIREBASE IDENTITY)
    // ==========================================
    async function handleAuth() {
      const email = document.getElementById('auth-email').value.trim().toLowerCase();
      const pass = document.getElementById('auth-password').value.trim();
      const phone = cleanPhone(document.getElementById('auth-phone').value);
      const submitBtn = document.getElementById('auth-submit-btn');

      if (!email || !email.includes('@') || !pass) {
        alert('Please enter a valid email address and password!');
        return;
      }

      submitBtn.innerText = 'Authenticating...';
      submitBtn.disabled = true;

      try {
        if (isLoginMode) {
          // Real Firebase Password Verification
          const userCred = await auth.signInWithEmailAndPassword(email, pass);
          const userDoc = await db.collection('users').doc(userCred.user.uid).get();
          const uPhone = userDoc.exists ? userDoc.data().phone : '+2348000000000';
          completeLogin(email, uPhone);
        } else {
          // Real Firebase Account Creation
          if (!phone || phone.length < 8) {
            alert('Please enter a valid phone number with country code (+234...)!');
            submitBtn.innerText = 'Sign Up & Continue';
            submitBtn.disabled = false;
            return;
          }

          const userCred = await auth.createUserWithEmailAndPassword(email, pass);
          await db.collection('users').doc(userCred.user.uid).set({
            email: email,
            phone: phone,
            authType: 'email',
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
          });

          completeLogin(email, phone);
        }
      } catch (err) {
        alert('Authentication Error: ' + err.message);
        submitBtn.innerText = isLoginMode ? 'Log In' : 'Sign Up & Continue';
        submitBtn.disabled = false;
      }
    }

    // Auto-listen to real Firebase login state
    auth.onAuthStateChanged(async (user) => {
      if (user && !currentUser) {
        try {
          const userDoc = await db.collection('users').doc(user.uid).get();
          if (userDoc.exists && userDoc.data().phone) {
            completeLogin(user.displayName || user.email, userDoc.data().phone);
          }
        } catch (e) {
          console.warn("Session check:", e);
        }
      }
    });

    function completeLogin(identifier, phone) {
      currentUser = identifier;
      currentUserPhone = phone;

      document.getElementById('user-display').innerText = `${phone}`;
      
      // STRICT UNLOCK: Reveal App & Navigation Bar
      document.getElementById('auth-screen').classList.remove('active');
      document.getElementById('feed-screen').classList.add('active');
      const nav = document.getElementById('main-nav');
      nav.style.setProperty('display', 'flex', 'important');

      loadSavedContacts();
    }

    function switchTab(screenId, element) {
      if (!currentUserPhone) {
        alert('Please sign in first!');
        return;
      }
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
      document.getElementById(screenId).classList.add('active');
      element.classList.add('active');
    }

    // ==========================================
    // 3. CONTACT PICKER & NATIVE SMS INVITES
    // ==========================================
    async function syncPhoneContacts() {
      if ('contacts' in navigator && 'select' in navigator.contacts) {
        try {
          const props = ['name', 'tel'];
          const selected = await navigator.contacts.select(props, { multiple: true });
          if (selected && selected.length > 0) {
            processContacts(selected);
            return;
          }
        } catch (e) {
          console.warn('Native picker cancelled');
        }
      }
      manualAddContact();
    }

    function manualAddContact() {
      const name = prompt("Enter contact's name:");
      const phone = prompt("Enter contact's phone number with country code (+234...):");
      if (name && phone) {
        processContacts([{ name: [name], tel: [phone] }]);
      }
    }

    async function processContacts(rawList) {
      for (const item of rawList) {
        const rawPhone = item.tel && item.tel[0] ? item.tel[0] : '';
        const phone = cleanPhone(rawPhone);
        const name = item.name && item.name[0] ? item.name[0] : phone;

        if (phone && phone !== currentUserPhone) {
          let hasApp = false;
          try {
            const query = await db.collection('users').where('phone', '==', phone).get();
            hasApp = !query.empty;
          } catch(e) {}

          if (!mySyncedContacts.some(c => c.phone === phone)) {
            mySyncedContacts.push({ name, phone, hasApp });
          }
        }
      }

      localStorage.setItem(`contacts_${currentUserPhone}`, JSON.stringify(mySyncedContacts));
      renderContacts();
      listenToContactFeed();
    }

    function loadSavedContacts() {
      const saved = localStorage.getItem(`contacts_${currentUserPhone}`);
      if (saved) {
        mySyncedContacts = JSON.parse(saved);
        renderContacts();
      }
      listenToContactFeed();
    }

    function renderContacts() {
      const list = document.getElementById('contacts-list');
      list.innerHTML = '';

      if (mySyncedContacts.length === 0) {
        list.innerHTML = '<p style="color:#64748b; text-align:center; padding:20px;">No contacts synced yet. Tap "📲 Sync Contacts" above!</p>';
        return;
      }

      mySyncedContacts.forEach(c => {
        const item = document.createElement('div');
        item.className = 'contact-item';
        item.innerHTML = `
          <div style="display:flex; align-items:center; gap:12px;">
            <div class="avatar">${c.name.charAt(0).toUpperCase()}</div>
            <div>
              <div style="font-weight:bold; font-size:15px;">${c.name}</div>
              <div style="font-size:12px; color:#94a3b8;">${c.phone}</div>
            </div>
          </div>
          <div>
            ${c.hasApp 
              ? `<button class="btn btn-blue" style="padding:6px 14px; font-size:12px; width:auto;" type="button" onclick="openChat('${c.phone}', '${c.name}')">Message (DM)</button>` 
              : `<button class="btn" style="padding:6px 14px; font-size:12px; width:auto; background:#10b981;" type="button" onclick="inviteContact('${c.phone}', '${c.name}')">Invite (SMS)</button>`
            }
          </div>
        `;
        list.appendChild(item);
      });
    }

    function inviteContact(phone, name) {
      const text = encodeURIComponent(`Hello ${name}, join me on 80 knee to chat, post, and recharge airtime/data: https://eight0-knee.onrender.com/`);
      const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
      const clean = phone.replace(/[^0-9+]/g, '');
      window.location.href = isIOS ? `sms:${clean}&body=${text}` : `sms:${clean}?body=${text}`;
    }
// ==========================================
    // 4. WHATSAPP STYLE 1-ON-1 DIRECT MESSAGING
    // ==========================================
    function openChat(recipientPhone, recipientName) {
      activeChatContact = { phone: recipientPhone, name: recipientName };
      document.getElementById('active-chat-name').innerText = `${recipientName} (${recipientPhone})`;
      document.getElementById('active-chat-avatar').innerText = recipientName.charAt(0).toUpperCase();
      document.getElementById('chat-view').style.display = 'flex';

      if (chatUnsubscribe) chatUnsubscribe();

      const chatId = [currentUserPhone, recipientPhone].sort().join('_');
      chatUnsubscribe = db.collection('chats').doc(chatId).collection('messages')
        .orderBy('timestamp', 'asc')
        .onSnapshot(snapshot => {
          const body = document.getElementById('chat-body');
          body.innerHTML = '';
          snapshot.forEach(doc => {
            const m = doc.data();
            const bubble = document.createElement('div');
            bubble.className = `bubble ${m.senderPhone === currentUserPhone ? 'me' : 'them'}`;
            bubble.innerText = m.text;
            body.appendChild(bubble);
          });
          body.scrollTop = body.scrollHeight;
        });
    }

    function closeChat() {
      document.getElementById('chat-view').style.display = 'none';
      if (chatUnsubscribe) {
        chatUnsubscribe();
        chatUnsubscribe = null;
      }
    }

    async function sendChatMessage() {
      const input = document.getElementById('chat-input');
      const text = input.value.trim();
      if (!text || !activeChatContact) return;

      input.value = '';

      const chatId = [currentUserPhone, activeChatContact.phone].sort().join('_');
      await db.collection('chats').doc(chatId).collection('messages').add({
        sender: currentUser,
        senderPhone: currentUserPhone,
        receiverPhone: activeChatContact.phone,
        text: text,
        timestamp: firebase.firestore.FieldValue.serverTimestamp()
      });
    }

    // ==========================================
    // 5. CONTACT-ONLY FEED & POST EDITING
    // ==========================================
    function listenToContactFeed() {
      const allowedPhones = [currentUserPhone, ...mySyncedContacts.map(c => c.phone)];

      db.collection('posts')
        .orderBy('timestamp', 'desc')
        .onSnapshot(snapshot => {
          const container = document.getElementById('posts-container');
          container.innerHTML = '';
          let count = 0;

          snapshot.forEach(doc => {
            const post = { id: doc.id, ...doc.data() };
            if (allowedPhones.includes(post.authorPhone)) {
              count++;
              renderPostCard(container, post);
            }
          });

          if (count === 0) {
            container.innerHTML = '<p style="color:#64748b; text-align:center; padding:20px;">No posts from contacts yet. Tap "Sync Contacts" or share a post!</p>';
          }
        });
    }

    function renderPostCard(container, post) {
      const isMine = post.authorPhone === currentUserPhone;
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div class="post-header">
          <h4 style="color:#38bdf8;">@${post.author} <span style="font-size:11px; color:#64748b;">(${post.authorPhone})</span></h4>
          ${isMine ? `<span class="edit-btn" onclick="editPost('${post.id}')">✏️ Edit</span>` : ''}
        </div>
        <p style="font-size: 14px; color: #cbd5e1; line-height: 1.4; margin-bottom: 10px;">${post.content}</p>
        <div class="post-actions">
          <span onclick="toggleLike('${post.id}', ${post.likes || 0})">
            ${(post.likedBy || []).includes(currentUserPhone) ? '❤️' : '🤍'} ${post.likes || 0}
          </span>
          <span onclick="toggleComments('${post.id}')">
            💬 ${(post.comments || []).length} Comments
          </span>
          <span onclick="sharePost('${encodeURIComponent(post.content)}')">
            🔗 Share
          </span>
        </div>
        <div class="comments-box" id="comments-${post.id}">
          <div style="font-size: 13px; color: #94a3b8; display:flex; flex-direction:column; gap:4px; margin-bottom:8px;">
            ${(post.comments || []).map(c => `<div>• <b>${c.user}:</b> ${c.text}</div>`).join('')}
          </div>
          <div style="display:flex; gap:6px;">
            <input type="text" id="comment-input-${post.id}" class="input-box" style="margin:0; padding:8px 10px; font-size:12px;" placeholder="Write a comment...">
            <button class="btn btn-blue" style="width:auto; padding:0 12px; font-size:12px;" type="button" onclick="addComment('${post.id}')">Reply</button>
          </div>
        </div>
      `;
      container.appendChild(card);
    }

    async function createPost() {
      const input = document.getElementById('post-input');
      const text = input.value.trim();
      if (!text) return;

      input.value = '';

      await db.collection('posts').add({
        author: currentUser,
        authorPhone: currentUserPhone,
        content: text,
        likes: 0,
        likedBy: [],
        comments: [],
        timestamp: firebase.firestore.FieldValue.serverTimestamp()
      });
    }

    async function editPost(id) {
      const newText = prompt('Enter new post text:');
      if (newText && newText.trim()) {
        await db.collection('posts').doc(id).update({ content: newText.trim() });
      }
    }

    async function toggleLike(id, currentLikes) {
      const ref = db.collection('posts').doc(id);
      const doc = await ref.get();
      if (!doc.exists) return;
      
      const likedBy = doc.data().likedBy || [];
      const isLiked = likedBy.includes(currentUserPhone);

      if (isLiked) {
        await ref.update({
          likes: Math.max(0, currentLikes - 1),
          likedBy: firebase.firestore.FieldValue.arrayRemove(currentUserPhone)
        });
      } else {
        await ref.update({
          likes: currentLikes + 1,
          likedBy: firebase.firestore.FieldValue.arrayUnion(currentUserPhone)
        });
      }
    }

    function toggleComments(id) {
      const box = document.getElementById(`comments-${id}`);
      box.style.display = box.style.display === 'block' ? 'none' : 'block';
    }

    async function addComment(id) {
      const input = document.getElementById(`comment-input-${id}`);
      const val = input.value.trim();
      if (!val) return;

      await db.collection('posts').doc(id).update({
        comments: firebase.firestore.FieldValue.arrayUnion({ user: currentUser, text: val })
      });
      input.value = '';
    }

    function sharePost(contentEncoded) {
      const text = `"${decodeURIComponent(contentEncoded)}" — on 80 knee`;
      if (navigator.share) {
        navigator.share({ title: '80 knee', text: text, url: window.location.href });
      } else {
        navigator.clipboard.writeText(text);
        alert('Post link copied to clipboard!');
      }
    }

    // ==========================================
    // 6. VTU, VTPASS & LIVE PAYSTACK CHECKOUT
    // ==========================================
    const VTPASS_API_KEY = '3a3fd3a4d9fd1f696c2137497b527ed2';
    const VTPASS_PUBLIC_KEY = 'PK_669fce066b3e90f9d662c1f163cf92534e285944b9e';
    const VTPASS_SECRET_KEY = 'SK_51666bd1b0ade08e53487104f36e03a378a3e16913c';
    const PAYSTACK_PUBLIC_KEY = 'pk_live_c70a3f5403ab816952f6bcd3b7243dc3bafb4318';

    function setVtuMode(mode) {
      vtuMode = mode;
      document.getElementById('toggle-airtime').className = mode === 'airtime' ? 'active' : '';
      document.getElementById('toggle-data').className = mode === 'data' ? 'active' : '';
      document.getElementById('airtime-section').style.display = mode === 'airtime' ? 'block' : 'none';
      document.getElementById('data-section').style.display = mode === 'data' ? 'block' : 'none';
    }

    function pickNet(btn) {
      document.querySelectorAll('.net-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      selectedNet = btn.innerText;
    }

    function openBankCheckout() {
      const phone = cleanPhone(document.getElementById('vtu-phone').value);
      if (!phone || phone.length < 8) {
        alert('Please enter a valid recipient phone number!');
        return;
      }

      let amount = 0;
      let label = '';

      if (vtuMode === 'airtime') {
        amount = parseFloat(document.getElementById('airtime-amount').value);
        if (!amount || amount < 50) {
          alert('Minimum airtime amount is ₦50');
          return;
        }
        label = `₦${amount} ${selectedNet} Airtime`;
      } else {
        const select = document.getElementById('data-plan-select');
        amount = parseFloat(select.value);
        label = `${selectedNet} ${select.options[select.selectedIndex].text}`;
      }

      payWithPaystack(amount, label, phone);
    }

    function payWithPaystack(amount, label, phone) {
      const userEmail = `${currentUserPhone.replace(/[^0-9]/g, '')}@80knee.com`;
      const transRef = '80KNEE_' + Math.floor(Math.random() * 1000000000 + 1);

      const handler = PaystackPop.setup({
        key: PAYSTACK_PUBLIC_KEY,
        email: userEmail,
        amount: amount * 100,
        currency: 'NGN',
        ref: transRef,
        channels: ['bank_transfer', 'card', 'ussd', 'bank'],
        callback: function(response) {
          alert(`🎉 Payment Confirmed via Paystack!\nRef: ${response.reference}\n\nDispatching ${label} to ${phone} via VTPass...`);
          deliverVTPassFulfillment(phone, amount, selectedNet, response.reference);
        },
        onClose: function() {
          alert('Payment cancelled.');
        }
      });

      handler.openIframe();
    }

    async function deliverVTPassFulfillment(phone, amount, network, paystackRef) {
      const networkMap = { 'MTN': 'mtn', 'AIRTEL': 'airtel', 'GLO': 'glo', '9MOBILE': 'etisalat' };
      const serviceID = networkMap[network.toUpperCase()] || 'mtn';

      const now = new Date();
      const requestId = `${now.getFullYear()}${String(now.getMonth()+1).padStart(2,'0')}${String(now.getDate()).padStart(2,'0')}${String(now.getHours()).padStart(2,'0')}${String(now.getMinutes()).padStart(2,'0')}${Math.floor(1000+Math.random()*9000)}`;

      await db.collection('vtu_orders').add({
        user: currentUser,
        userPhone: currentUserPhone,
        recipientPhone: phone,
        amount: amount,
        network: network,
        paystackRef: paystackRef,
        requestId: requestId,
        status: 'SENT_TO_VTPASS',
        timestamp: firebase.firestore.FieldValue.serverTimestamp()
      });

      try {
        const response = await fetch('https://vtpass.com/api/pay', {
          method: 'POST',
          headers: {
            'api-key': VTPASS_API_KEY,
            'secret-key': VTPASS_SECRET_KEY,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            request_id: requestId,
            serviceID: serviceID,
            amount: amount,
            phone: phone
          })
        });

        const result = await response.json();
        if (result.code === '000') {
          alert(`✅ AIRTIME DELIVERED!\n\n₦${amount} ${network} recharge credited to ${phone}.`);
        } else {
          alert(`Telecom Status: ${result.response_description || 'Processed by network.'}`);
        }
      } catch (err) {
        alert(`✅ Payment Recorded!\nOrder #${paystackRef} saved to 80 knee cloud database.`);
      }
    }
  </script>
