<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>80 knee</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { background: #0f172a; color: white; display: flex; flex-direction: column; height: 100vh; overflow: hidden; padding-bottom: 62px; }
    .top-bar { background: #1e293b; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; flex-shrink: 0; }
    .logo { font-size: 19px; font-weight: 800; color: #38bdf8; }
    .wallet-badge { background: rgba(16,185,129,0.15); border: 1px solid #10b981; color: #10b981; padding: 5px 10px; border-radius: 16px; font-size: 13px; font-weight: 700; }
    .screen { flex: 1; overflow-y: auto; padding: 16px; display: none; }
    .screen.active { display: flex; flex-direction: column; }
    #auth-screen { justify-content: center; align-items: center; text-align: center; }
    .auth-card { background: #1e293b; padding: 24px; border-radius: 16px; width: 100%; max-width: 340px; border: 1px solid #334155; }
    .card { background: #1e293b; border-radius: 14px; padding: 14px; margin-bottom: 12px; border: 1px solid #334155; }
    .card h4 { color: #38bdf8; margin-bottom: 4px; font-size: 15px; }
    .input-box { width: 100%; padding: 12px; background: #0f172a; border: 1px solid #334155; border-radius: 10px; color: white; font-size: 14px; margin-top: 6px; margin-bottom: 12px; outline: none; }
    .btn { width: 100%; padding: 12px; background: #10b981; border: none; border-radius: 10px; color: white; font-size: 15px; font-weight: 700; cursor: pointer; }
    .btn-blue { background: #0284c7; }
    .network-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 12px; }
    .net-btn { padding: 9px 2px; background: #0f172a; border: 1px solid #334155; border-radius: 8px; color: #94a3b8; font-size: 11px; font-weight: 700; text-align: center; cursor: pointer; }
    .net-btn.selected { border-color: #38bdf8; color: #38bdf8; background: rgba(56,189,248,0.1); }
    .vtu-toggle { display: flex; background: #0f172a; border-radius: 8px; padding: 3px; margin-bottom: 14px; }
    .vtu-toggle div { flex: 1; text-align: center; padding: 8px; font-size: 13px; font-weight: 600; cursor: pointer; border-radius: 6px; color: #94a3b8; }
    .vtu-toggle div.active { background: #0284c7; color: white; }
    .chat-messages { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
    .bubble { max-width: 80%; padding: 10px 14px; border-radius: 14px; font-size: 14px; line-height: 1.3; }
    .bubble.me { align-self: flex-end; background: #0284c7; border-bottom-right-radius: 2px; }
    .bubble.them { align-self: flex-start; background: #1e293b; border-bottom-left-radius: 2px; }
    .chat-input-bar { display: flex; gap: 8px; }
    /* FIXED BOTTOM BAR - Always visible */
    .nav-bar { position: fixed; bottom: 0; left: 0; right: 0; z-index: 100; background: #1e293b; display: flex; justify-content: space-around; padding: 10px 0 14px 0; border-top: 1px solid #334155; }
    .nav-item { display: flex; flex-direction: column; align-items: center; color: #94a3b8; font-size: 11px; cursor: pointer; flex: 1; }
    .nav-item.active { color: #38bdf8; font-weight: 700; }
    .nav-icon { font-size: 19px; margin-bottom: 2px; }
  </style>
</head>
<body>
  <div class="top-bar">
    <div class="logo">80 knee</div>
    <div style="display:flex; align-items:center; gap:8px;">
      <span id="user-tag" style="font-size:12px; color:#94a3b8;">Guest</span>
      <div class="wallet-badge" id="wallet-display">₦0.00</div>
    </div>
  </div>

  <div id="auth-screen" class="screen active">
    <div class="auth-card">
      <h2 style="color:#38bdf8; margin-bottom: 6px;">Welcome to 80 knee</h2>
      <p style="font-size:13px; color:#94a3b8; margin-bottom:16px;">Sign in to access your wallet, feed & chat</p>
      <input type="text" id="auth-username" class="input-box" placeholder="Enter your username (e.g. Etini)">
      <input type="password" id="auth-password" class="input-box" placeholder="Enter password">
      <button class="btn btn-blue" onclick="handleLogin()">Sign In / Register</button>
      <p style="font-size:11px; color:#64748b; margin-top:12px;">New users get ₦500 welcome bonus.</p>
    </div>
  </div>

  <div id="feed-screen" class="screen">
    <div class="card">
      <input type="text" id="post-input" class="input-box" placeholder="What's happening? Post on 80 knee...">
      <button class="btn btn-blue" onclick="createPost()">Share Post</button>
    </div>
    <div id="posts-container"></div>
  </div>

  <div id="chat-screen" class="screen">
    <div style="font-size:13px; color:#38bdf8; font-weight:700; margin-bottom:8px;">Chatting with: 80 knee Support</div>
    <div class="chat-messages" id="chat-box"></div>
    <div class="chat-input-bar">
      <input type="text" id="chat-input" class="input-box" style="margin:0;" placeholder="Type a message...">
      <button class="btn btn-blue" style="width: auto; padding: 0 16px;" onclick="sendChatMessage()">Send</button>
    </div>
  </div>

  <div id="vtu-screen" class="screen">
    <div class="vtu-toggle">
      <div id="toggle-airtime" class="active" onclick="setVtuMode('airtime')">Airtime</div>
      <div id="toggle-data" onclick="setVtuMode('data')">Data Bundle</div>
    </div>
    <div class="network-grid">
      <div class="net-btn selected" onclick="pickNet(this)">MTN</div>
      <div class="net-btn" onclick="pickNet(this)">AIRTEL</div>
      <div class="net-btn" onclick="pickNet(this)">GLO</div>
      <div class="net-btn" onclick="pickNet(this)">9MOBILE</div>
    </div>
    <label style="font-size: 13px; color: #94a3b8;">Phone Number</label>
    <input type="tel" id="vtu-phone" class="input-box" placeholder="e.g. 08012345678">
    <div id="airtime-section">
      <label style="font-size: 13px; color: #94a3b8;">Amount (₦)</label>
      <input type="number" id="airtime-amount" class="input-box" placeholder="e.g. 500">
    </div>
    <div id="data-section" style="display:none;">
      <label style="font-size: 13px; color: #94a3b8;">Choose Data Plan</label>
      <select id="data-plan-select" class="input-box" style="background:#0f172a;">
        <option value="350">1.0 GB Daily - ₦350</option>
        <option value="600">2.5 GB (2 Days) - ₦600</option>
        <option value="1500">5.0 GB Monthly - ₦1,500</option>
        <option value="3000">10.0 GB Monthly - ₦3,000</option>
      </select>
    </div>
    <button class="btn" onclick="processPurchase()">Confirm & Pay from Wallet</button>
    <div id="vtu-history" style="margin-top:14px;"></div>
  </div>

  <div class="nav-bar" id="main-nav" style="display:none;">
    <div class="nav-item active" onclick="switchTab('feed-screen', this)"><div class="nav-icon">📰</div><span>Feed</span></div>
    <div class="nav-item" onclick="switchTab('chat-screen', this)"><div class="nav-icon">💬</div><span>Chat</span></div>
    <div class="nav-item" onclick="switchTab('vtu-screen', this)"><div class="nav-icon">⚡</div><span>Airtime/Data</span></div>
  </div>

<script>
    let currentUser = null;
    let walletBalance = 5000.00; // Starter simulated balance for testing
    let vtuMode = 'airtime';

    function updateWalletDisplay() {
      document.getElementById('wallet-display').innerText = 
        '₦' + walletBalance.toLocaleString(undefined, {minimumFractionDigits: 2});
    }

    // 1. Authentication
    function handleLogin() {
      const user = document.getElementById('auth-username').value.trim();
      if (!user) { 
        alert('Please enter a username!'); 
        return; 
      }
      
      currentUser = user;
      document.getElementById('user-tag').innerText = '@' + currentUser;
      updateWalletDisplay();
      
      document.getElementById('auth-screen').classList.remove('active');
      document.getElementById('feed-screen').classList.add('active');
      document.getElementById('main-nav').style.display = 'flex';
    }

    // 2. Navigation Tabs
    function switchTab(screenId, element) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
      document.getElementById(screenId).classList.add('active');
      element.classList.add('active');
    }

    // 3. Social Feed & Posts
    function createPost() {
      const input = document.getElementById('post-input');
      const text = input.value.trim();
      if (!text) return;

      const container = document.getElementById('posts-container');
      const postCard = document.createElement('div');
      postCard.className = 'card';
      postCard.innerHTML = `
        <h4>${currentUser} (You)</h4>
        <p style="font-size: 14px; color: #cbd5e1; margin: 4px 0 8px 0;">${text}</p>
        <span onclick="likePost(this)" style="font-size: 13px; color: #f43f5e; cursor: pointer;">🤍 0 Likes</span>
      `;
      container.prepend(postCard);
      input.value = '';
    }

    function likePost(el) {
      let isLiked = el.innerText.includes('❤️');
      let parts = el.innerText.split(' ');
      let count = parseInt(parts[1]) || 0;
      count = isLiked ? count - 1 : count + 1;
      el.innerText = (isLiked ? '🤍 ' : '❤️ ') + count + ' Likes';
    }

    // 4. Interactive Chat (With Instant Auto-Reply)
    function sendChatMessage() {
      const input = document.getElementById('chat-input');
      const msg = input.value.trim();
      if (!msg) return;

      const chatBox = document.getElementById('chat-box');
      
      // User message bubble
      const userBubble = document.createElement('div');
      userBubble.className = 'bubble me';
      userBubble.innerText = msg;
      chatBox.appendChild(userBubble);
      input.value = '';
      chatBox.scrollTop = chatBox.scrollHeight;

      // Simulated instant reply from support
      setTimeout(() => {
        const replyBubble = document.createElement('div');
        replyBubble.className = 'bubble them';
        replyBubble.innerText = `Thanks for reaching out to 80 knee, ${currentUser}! We received your message: "${msg}"`;
        chatBox.appendChild(replyBubble);
        chatBox.scrollTop = chatBox.scrollHeight;
      }, 800);
    }

    // 5. VTU Airtime & Data Purchases
    function setVtuMode(mode) {
      vtuMode = mode;
      document.getElementById('toggle-airtime').className = mode === 'airtime' ? 'active' : '';
      document.getElementById('toggle-data').className = mode === 'data' ? 'active' : '';
      document.getElementById('airtime-section').style.display = mode === 'airtime' ? 'block' : 'none';
      document.getElementById('data-section').style.display = mode === 'data' ? 'block' : 'none';
    }

    function pickNet(btn) {
      document.querySelectorAll('.net-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
    }

    function processPurchase() {
      const phone = document.getElementById('vtu-phone').value.trim();
      if (!phone || phone.length < 10) {
        alert('Please enter a valid phone number!');
        return;
      }

      let cost = 0;
      let label = '';

      if (vtuMode === 'airtime') {
        cost = parseFloat(document.getElementById('airtime-amount').value);
        if (!cost || cost < 50) { 
          alert('Minimum airtime amount is ₦50'); 
          return; 
        }
        label = `₦${cost} Airtime`;
      } else {
        const plan = document.getElementById('data-plan-select');
        cost = parseFloat(plan.value);
        label = plan.options[plan.selectedIndex].text;
      }

      if (walletBalance < cost) {
        alert('Insufficient wallet balance! Please fund your 80 knee wallet.');
        return;
      }

      // Deduct balance and update display
      walletBalance -= cost;
      updateWalletDisplay();
      alert(`🎉 Success! ${label} recharge sent to ${phone}. ₦${cost} deducted from your wallet.`);
    }
  </script>
</body>
</html>
