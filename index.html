<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>80 knee</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { background: #0f172a; color: white; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    .top-bar { background: #1e293b; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; }
    .logo { font-size: 19px; font-weight: 800; color: #38bdf8; letter-spacing: 0.5px; }
    .wallet-badge { background: rgba(16,185,129,0.15); border: 1px solid #10b981; color: #10b981; padding: 5px 10px; border-radius: 16px; font-size: 13px; font-weight: 700; }
    .screen { flex: 1; overflow-y: auto; padding: 16px; display: none; }
    .screen.active { display: flex; flex-direction: column; }
    #auth-screen { justify-content: center; align-items: center; text-align: center; }
    .auth-card { background: #1e293b; padding: 24px; border-radius: 16px; width: 100%; max-width: 340px; border: 1px solid #334155; }
    .card { background: #1e293b; border-radius: 14px; padding: 14px; margin-bottom: 12px; border: 1px solid #334155; }
    .card h4 { color: #38bdf8; margin-bottom: 4px; font-size: 15px; }
    .input-box { width: 100%; padding: 12px; background: #0f172a; border: 1px solid #334155; border-radius: 10px; color: white; font-size: 14px; margin-top: 6px; margin-bottom: 12px; outline: none; }
    .btn { width: 100%; padding: 12px; background: #10b981; border: none; border-radius: 10px; color: white; font-size: 15px; font-weight: 700; cursor: pointer; }
    .btn-blue { background: #0284c7; }
    .network-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 12px; }
    .net-btn { padding: 9px 2px; background: #0f172a; border: 1px solid #334155; border-radius: 8px; color: #94a3b8; font-size: 11px; font-weight: 700; text-align: center; cursor: pointer; }
    .net-btn.selected { border-color: #38bdf8; color: #38bdf8; background: rgba(56,189,248,0.1); }
    .vtu-toggle { display: flex; background: #0f172a; border-radius: 8px; padding: 3px; margin-bottom: 14px; }
    .vtu-toggle div { flex: 1; text-align: center; padding: 8px; font-size: 13px; font-weight: 600; cursor: pointer; border-radius: 6px; color: #94a3b8; }
    .vtu-toggle div.active { background: #0284c7; color: white; }
    .chat-messages { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
    .bubble { max-width: 80%; padding: 10px 14px; border-radius: 14px; font-size: 14px; line-height: 1.3; }
    .bubble.me { align-self: flex-end; background: #0284c7; border-bottom-right-radius: 2px; }
    .bubble.them { align-self: flex-start; background: #1e293b; border-bottom-left-radius: 2px; }
    .chat-input-bar { display: flex; gap: 8px; }
    .nav-bar { background: #1e293b; display: flex; justify-content: space-around; padding: 10px 0; border-top: 1px solid #334155; }
    .nav-item { display: flex; flex-direction: column; align-items: center; color: #94a3b8; font-size: 11px; cursor: pointer; }
    .nav-item.active { color: #38bdf8; font-weight: 700; }
    .nav-icon { font-size: 19px; margin-bottom: 2px; }
  </style>
</head>
<body>
  <div class="top-bar">
    <div class="logo">80 knee</div>
    <div style="display:flex; align-items:center; gap:8px;">
      <span id="user-tag" style="font-size:12px; color:#94a3b8;">Guest</span>
      <div class="wallet-badge" id="wallet-display">₦0.00</div>
    </div>
  </div>

  <div id="auth-screen" class="screen active">
    <div class="auth-card">
      <h2 style="color:#38bdf8; margin-bottom: 6px;">Welcome to 80 knee</h2>
      <p style="font-size:13px; color:#94a3b8; margin-bottom:16px;">Sign in to access your wallet, feed & chat</p>
      <input type="text" id="auth-username" class="input-box" placeholder="Enter your username (e.g. Etini)">
      <input type="password" id="auth-password" class="input-box" placeholder="Enter password">
      <button class="btn btn-blue" onclick="handleLogin()">Sign In / Register</button>
      <p style="font-size:11px; color:#64748b; margin-top:12px;">No Replit needed. Your account is saved on this device. New users get ₦1,000 bonus.</p>
    </div>
  </div>

  <div id="feed-screen" class="screen">
    <div class="card">
      <input type="text" id="post-input" class="input-box" placeholder="What's happening? Post on 80 knee...">
      <button class="btn btn-blue" onclick="createPost()">Share Post</button>
    </div>
    <div id="posts-container"></div>
  </div>

  <div id="chat-screen" class="screen">
    <div style="font-size:13px; color:#38bdf8; font-weight:700; margin-bottom:8px;">Chatting with: 80 knee Support</div>
    <div class="chat-messages" id="chat-box"></div>
    <div class="chat-input-bar">
      <input type="text" id="chat-input" class="input-box" style="margin:0;" placeholder="Type a message...">
      <button class="btn btn-blue" style="width: auto; padding: 0 16px;" onclick="sendChatMessage()">Send</button>
    </div>
  </div>

  <div id="vtu-screen" class="screen">
    <div class="vtu-toggle">
      <div id="toggle-airtime" class="active" onclick="setVtuMode('airtime')">Airtime</div>
      <div id="toggle-data" onclick="setVtuMode('data')">Data Bundle</div>
    </div>
    <div class="network-grid">
      <div class="net-btn selected" onclick="pickNet(this)">MTN</div>
      <div class="net-btn" onclick="pickNet(this)">AIRTEL</div>
      <div class="net-btn" onclick="pickNet(this)">GLO</div>
      <div class="net-btn" onclick="pickNet(this)">9MOBILE</div>
    </div>
    <label style="font-size: 13px; color: #94a3b8;">Phone Number</label>
    <input type="tel" id="vtu-phone" class="input-box" placeholder="e.g. 08012345678">
    <div id="airtime-section">
      <label style="font-size: 13px; color: #94a3b8;">Amount (₦)</label>
      <input type="number" id="airtime-amount" class="input-box" placeholder="e.g. 500">
    </div>
    <div id="data-section" style="display:none;">
      <label style="font-size: 13px; color: #94a3b8;">Choose Data Plan</label>
      <select id="data-plan-select" class="input-box" style="background:#0f172a;">
        <option value="350">1.0 GB Daily - ₦350</option>
        <option value="600">2.5 GB (2 Days) - ₦600</option>
        <option value="1500">5.0 GB Monthly - ₦1,500</option>
        <option value="3000">10.0 GB Monthly - ₦3,000</option>
      </select>
    </div>
    <button class="btn" onclick="processPurchase()">Confirm & Pay from Wallet</button>
    <div id="vtu-history" style="margin-top:14px;"></div>
  </div>

  <div class="nav-bar" id="main-nav" style="display:none;">
    <div class="nav-item active" onclick="switchTab('feed-screen', this)"><div class="nav-icon">📰</div><span>Feed</span></div>
    <div class="nav-item" onclick="switchTab('chat-screen', this)"><div class="nav-icon">💬</div><span>Chat</span></div>
    <div class="nav-item" onclick="switchTab('vtu-screen', this)"><div class="nav-icon">⚡</div><span>Airtime/Data</span></div>
  </div>

<script>
// NO REPLIT - All data saved in phone (localStorage)
let currentUser = localStorage.getItem('80knee_currentUser') || null;
let walletBalance = 0;
let vtuMode = 'airtime';
let selectedNetwork = 'MTN';

function getData(key, def){ try{ return JSON.parse(localStorage.getItem(key)) || def; }catch(e){ return def; } }
function saveData(key, val){ localStorage.setItem(key, JSON.stringify(val)); }
function saveUsers(users){ saveData('80knee_users', users); }
function getUsers(){ return getData('80knee_users', []); }
function saveWallet(){ if(currentUser){ let u = getUsers(); let me = u.find(x=>x.username===currentUser); if(me){ me.wallet = walletBalance; saveUsers(u); } } }

function updateWalletDisplay(){
  document.getElementById('wallet-display').innerText = '₦' + Number(walletBalance).toLocaleString(undefined,{minimumFractionDigits:2});
}
function showApp(){
  document.getElementById('user-tag').innerText = '@' + currentUser;
  updateWalletDisplay();
  document.getElementById('auth-screen').classList.remove('active');
  document.getElementById('feed-screen').classList.add('active');
  document.getElementById('main-nav').style.display = 'flex';
  loadFeed(); loadChat(); renderHistory();
}

window.addEventListener('DOMContentLoaded', () => {
  if(currentUser){
    let me = getUsers().find(x=>x.username===currentUser);
    if(me){ walletBalance = me.wallet || 0; showApp(); }
    else { localStorage.removeItem('80knee_currentUser'); currentUser=null; }
  }
});

function handleLogin(){
  const username = document.getElementById('auth-username').value.trim();
  const password = document.getElementById('auth-password').value.trim();
  if(!username || !password){ alert('Please enter both username and password!'); return; }
  let users = getUsers();
  let found = users.find(u => u.username.toLowerCase() === username.toLowerCase());
  if(found){
    if(found.password !== password){ alert('Wrong password for this username. Try another username or correct password.'); return; }
    currentUser = found.username; walletBalance = found.wallet || 0;
    alert('Welcome back ' + currentUser + '!');
  } else {
    currentUser = username; walletBalance = 1000;
    users.push({ username: username, password: password, wallet: 1000 });
    saveUsers(users);
    alert('Account created! You got ₦1,000 welcome bonus.');
  }
  localStorage.setItem('80knee_currentUser', currentUser);
  showApp();
}

function switchTab(screenId, element){
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  document.getElementById(screenId).classList.add('active');
  if(element) element.classList.add('active');
  if(screenId==='feed-screen') loadFeed();
  if(screenId==='chat-screen') loadChat();
  if(screenId==='vtu-screen') renderHistory();
}

function loadFeed(){
  let posts = getData('80knee_posts', []);
  const container = document.getElementById('posts-container');
  container.innerHTML = '';
  // Default welcome post if empty
  if(posts.length===0){
    posts = [{ id: 1, username:'Etini (Founder)', content:'Welcome to 80 knee! Top up airtime, buy data bundles, and connect with people 🚀', likes:14, likedBy:[] }];
    saveData('80knee_posts', posts);
  }
  posts.forEach(post => {
    const card = document.createElement('div');
    card.className = 'card';
    const isLiked = (post.likedBy||[]).includes(currentUser);
    card.innerHTML = `<h4>@${post.username}</h4><p style="font-size:14px; color:#cbd5e1; margin:4px 0 8px 0;">${post.content}</p><span onclick="toggleLike(${post.id})" style="font-size:13px; color:#f43f5e; cursor:pointer;">${isLiked?'❤️':'🤍'} ${post.likes||0} Likes</span>`;
    container.appendChild(card);
  });
}
function createPost(){
  const input = document.getElementById('post-input');
  const text = input.value.trim(); if(!text) return;
  let posts = getData('80knee_posts', []);
  posts.unshift({ id: Date.now(), username: currentUser, content: text, likes: 0, likedBy: [] });
  saveData('80knee_posts', posts);
  input.value=''; loadFeed();
}
function toggleLike(postId){
  let posts = getData('80knee_posts', []);
  let p = posts.find(x=>x.id==postId); if(!p) return;
  p.likedBy = p.likedBy||[];
  if(p.likedBy.includes(currentUser)){ p.likedBy = p.likedBy.filter(u=>u!==currentUser); p.likes--; }
  else { p.likedBy.push(currentUser); p.likes++; }
  saveData('80knee_posts', posts); loadFeed();
}
// Old name kept for compatibility
function likePost(el){ if(el) el.innerText = '❤️ ' + (parseInt(el.innerText.replace(/\D/g,''))||0 + 1) + ' Likes'; }

function loadChat(){
  let msgs = getData('80knee_chats', []);
  if(msgs.length===0){ msgs=[{from:'them', text:'Hello! Welcome to 80 knee. How can we help you today?'}]; saveData('80knee_chats', msgs); }
  const box = document.getElementById('chat-box'); box.innerHTML='';
  msgs.forEach(m=>{ const d=document.createElement('div'); d.className='bubble '+(m.from==='me'?'me':'them'); d.innerText=m.text; box.appendChild(d); });
  box.scrollTop = box.scrollHeight;
}
function sendChatMessage(){
  const input = document.getElementById('chat-input');
  const msg = input.value.trim(); if(!msg) return;
  let msgs = getData('80knee_chats', []);
  msgs.push({from:'me', text:msg}); saveData('80knee_chats', msgs);
  input.value=''; loadChat();
  setTimeout(()=>{ let m2=getData('80knee_chats',[]); m2.push({from:'them', text:'Thanks for messaging 80 knee Support! We will reply soon. Your wallet balance is ₦'+Number(walletBalance).toLocaleString()+'.'}); saveData('80knee_chats', m2); loadChat(); }, 800);
}

function setVtuMode(mode){
  vtuMode = mode;
  document.getElementById('toggle-airtime').className = mode==='airtime'?'active':'';
  document.getElementById('toggle-data').className = mode==='data'?'active':'';
  document.getElementById('airtime-section').style.display = mode==='airtime'?'block':'none';
  document.getElementById('data-section').style.display = mode==='data'?'block':'none';
}
function pickNet(btn){
  document.querySelectorAll('.net-btn').forEach(b=>b.classList.remove('selected'));
  btn.classList.add('selected'); selectedNetwork = btn.innerText;
}
function renderHistory(){
  let h = getData('80knee_vtu', []);
  let div = document.getElementById('vtu-history');
  if(h.length===0){ div.innerHTML=''; return; }
  div.innerHTML = '<h4 style="color:#38bdf8; margin-bottom:8px; font-size:14px;">Recent Transactions</h4>' + h.slice(0,5).map(x=>`<div class="card" style="padding:10px;"><p style="font-size:13px;">${x.type} - ${x.network} - ${x.phone} - ₦${x.amount}</p><small style="color:#94a3b8;">${x.time}</small></div>`).join('');
}
function processPurchase(){
  const phone = document.getElementById('vtu-phone').value.trim();
  if(!phone || phone.length < 10){ alert('Please enter a valid phone number!'); return; }
  let amount=0, planText='';
  if(vtuMode==='airtime'){
    amount = parseFloat(document.getElementById('airtime-amount').value);
    if(!amount || amount < 50){ alert('Minimum airtime is ₦50'); return; }
  } else {
    const plan = document.getElementById('data-plan-select');
    amount = parseFloat(plan.value); planText = plan.options[plan.selectedIndex].text;
  }
  if(walletBalance < amount){ alert('Insufficient wallet balance! Your balance is ₦'+walletBalance.toLocaleString()+'. New users get ₦1,000 bonus.'); return; }
  walletBalance -= amount; saveWallet(); updateWalletDisplay();
  let h = getData('80knee_vtu', []);
  h.unshift({ type: vtuMode==='airtime'?'Airtime':'Data - '+planText, network: selectedNetwork, phone: phone, amount: amount, time: new Date().toLocaleString() });
  saveData('80knee_vtu', h);
  alert(`Success! ₦${amount} ${vtuMode} for ${phone} on ${selectedNetwork}. New balance: ₦${walletBalance.toLocaleString()}`);
  renderHistory();
}
</script>
</body>
</html>
